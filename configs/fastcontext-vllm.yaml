# vLLM alternative serving config for FastContext-1.0-4B-RL on GB10
# Launch: vllm serve microsoft/FastContext-1.0-4B-RL $(python configs/expand.py configs/fastcontext-vllm.yaml)

model: microsoft/FastContext-1.0-4B-RL
dtype: bfloat16
max_model_len: 262144
gpu_memory_utilization: 0.85
tensor_parallel_size: 1
trust_remote_code: true
enable_auto_tool_choice: true
tool_call_parser: qwen

# Serving
host: 0.0.0.0
port: 30000
served_model_name: FastContext-1.0-4B-RL

# GB10 optimizations
swap_space: 4
max_num_seqs: 16
max_num_batched_tokens: 8192
enforce_eager: false

# Environment
env:
  HF_HOME: /home/r0b0tdgx/models/hf-cache
  VLLM_USE_V1: "1"
